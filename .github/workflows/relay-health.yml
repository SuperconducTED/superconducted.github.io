# Daily health check of the live newsletter relay (relay/, a Cloudflare Worker): three requests
# that the relay refuses before it could reach Buttondown, so a run subscribes nobody
# (scripts/check_relay.py has the details).
#   * When a scheduled run fails, GitHub emails "the user who last modified the cron syntax in the
#     workflow file" (GitHub's workflow-events reference), provided that person's notification
#     settings keep Actions failure emails on.
#   * GitHub runs schedules on the default branch only, can delay them "during periods of high
#     loads", and in a public repository disables them "when no repository activity has occurred
#     in 60 days" (it emails a warning first).
#   * It cannot check that the Buttondown API key still works; only a real sign-up shows that.
#   * Pull requests that change this file or the script run it too, so a change is tested
#     against the live relay before it merges.
name: Relay health

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC (09:17 in Türkiye), off the top of the hour
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/relay-health.yml
      - scripts/check_relay.py

permissions:
  contents: read

concurrency:
  group: relay-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the live relay
        run: python3 -I scripts/check_relay.py
