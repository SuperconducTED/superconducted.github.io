<footer class="site-footer">
  <div class="wrap footer-grid">
    <div>
      <p class="footer-tagline" lang="en">{{ T "footer_tagline" }}</p>
      <p class="small">{{ T "footer_licence" }}</p>
      <p class="small">{{ T "footer_ibm" }}</p>
    </div>
    <nav aria-label="{{ T "footer_links" }}">
      <ul class="footer-links">
        <li><a href="{{ site.Params.org }}">{{ T "footer_org" }}</a></li>
        <li><a href="{{ site.Params.repo }}">{{ T "footer_repo" }}</a></li>
        <li><a href="{{ site.Params.repo }}/discussions">{{ T "footer_discussions" }}</a></li>
        <li><a href="{{ site.Params.repo }}/issues">{{ T "footer_issues" }}</a></li>
        <li><a href="{{ site.Params.brandGuide }}">{{ T "footer_brand" }}</a></li>
        <li><a href="{{ site.Params.siteRepo }}">{{ T "footer_site" }}</a></li>
      </ul>
    </nav>
  </div>
</footer>
