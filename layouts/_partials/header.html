<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ T "home" }}">
      <img class="on-light" src="{{ "brand/compact-on-light.svg" | absURL }}" alt="" width="249" height="40">
      <img class="on-dark" src="{{ "brand/compact-on-dark.svg" | absURL }}" alt="" width="249" height="40">
    </a>
    <nav class="site-nav" aria-label="{{ T "menu" }}">
      <ul>
        {{- $current := . }}
        {{- range site.Menus.main }}
        {{- $active := and .Page (eq .Page.RelPermalink $current.RelPermalink) }}
        <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <div class="header-tools">
      {{- range .Translations }}
      <a class="lang" href="{{ .RelPermalink }}" hreflang="{{ .Language.Locale }}" lang="{{ .Language.Locale }}" data-lang="{{ .Language.Lang }}">{{ .Language.Label }}</a>
      {{- end }}
      <button class="theme-toggle" type="button" aria-label="{{ T "theme_toggle" }}" data-label-light="{{ T "theme_light" }}" data-label-dark="{{ T "theme_dark" }}">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>
