# Figures used inside page text (not in the Home facts strip). Same rules as data/facts.yaml:
# every value is copied from a row of the noise engine's numerical-claims register
# (docs/numerical-claims.md), and scripts/check_site.py fails if the row's value column does not
# contain it. Text uses them as {claim:KEY} in front matter or {{% claim "KEY" %}} in Markdown,
# which prints the value, formatted for the page language, followed by its register row as a
# proof chip (layouts/_partials/claims-map.html). Facts from data/facts.yaml work the same way,
# plus KEY_of for their "of" total.
#   value: the registered value   nc: the register row id   as_of: the row's date
claims:
  - key: params
    value: 234
    nc: NC-045
    as_of: 2026-10-01
  - key: floor
    value: 1170
    nc: NC-045
    as_of: 2026-10-01
  - key: ensemble
    value: 32
    nc: NC-018
    as_of: 2026-05-25
